[project]
name = "trial-matcher"
version = "0.1.0"
description = "Clinical trial matching with criterion-level eligibility assessment (TREC Clinical Trials)"
readme = "README.md"
authors = [
    { name = "massimo-ruggiero", email = "ruggieromssm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.1",
    "python-dotenv>=1.2.3",
    "pytrec-eval-terrier>=0.5.10",
    "qdrant-client>=1.19.0",
    "requests>=2.32.0",
    "sentence-transformers>=6.0.1",
    "tqdm>=4.67.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

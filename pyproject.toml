[project]
name = "legal-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "massimo-ruggiero", email = "ruggieromssm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "typer>=0.27.2",
]

[project.scripts]
legal-rag = "legal_rag:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]